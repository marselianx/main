<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>404 — Marselo Anime</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
/* ── layout: full-screen centered, dark orange identity ── */
:root {
  --bg:        #04040a;
  --surface:   #0d0d16;
  --border:    rgba(255,255,255,0.06);
  --text:      #f0eee8;
  --muted:     #5a5965;
  --accent:    #ff7a1a;
  --accent-2:  #ffb02e;
  --ease:      cubic-bezier(0.16,1,0.3,1);
  --ease-spring: cubic-bezier(0.34,1.56,0.64,1);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding-left:  max(16px, env(safe-area-inset-left,  0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 48px;
  position: relative;
  user-select: none;
}

/* ── ambient glow ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 80% 60% at 50% 60%, rgba(255,122,26,0.10) 0%, transparent 65%),
    radial-gradient(ellipse 40% 40% at 15% 85%, rgba(255,176,46,0.07) 0%, transparent 55%),
    radial-gradient(ellipse 35% 30% at 85% 15%, rgba(255,90,10,0.06) 0%, transparent 50%),
    radial-gradient(ellipse 100% 40% at 50% 100%, rgba(255,122,26,0.08) 0%, transparent 50%);
  z-index: 0;
}

/* ── dot grid ── */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image: radial-gradient(circle, rgba(255,255,255,.06) 1px, transparent 1px);
  background-size: 36px 36px;
  mask-image: radial-gradient(ellipse 75% 75% at 50% 50%, black 30%, transparent 100%);
  -webkit-mask-image: radial-gradient(ellipse 75% 75% at 50% 50%, black 30%, transparent 100%);
  z-index: 0;
}

/* ── corners ── */
.corner {
  position: fixed;
  width: 32px;
  height: 32px;
  opacity: 0.14;
  pointer-events: none;
  animation: fadeUp 1s var(--ease) 1.2s both;
}
.corner--tl { top: 32px; left: 32px; border-top: 1px solid var(--accent-2); border-left: 1px solid var(--accent-2); }
.corner--tr { top: 32px; right: 32px; border-top: 1px solid var(--accent-2); border-right: 1px solid var(--accent-2); }
.corner--bl { bottom: 32px; left: 32px; border-bottom: 1px solid var(--accent-2); border-left: 1px solid var(--accent-2); }
.corner--br { bottom: 32px; right: 32px; border-bottom: 1px solid var(--accent-2); border-right: 1px solid var(--accent-2); }

/* ── stage ── */
.stage {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  max-width: 640px;
  width: 100%;
}

/* ── eyebrow ── */
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255,176,46,0.6);
  margin-bottom: 32px;
  opacity: 0;
  animation: fadeUp 0.7s var(--ease) 0.1s forwards;
}
.eyebrow-line {
  width: 28px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,176,46,0.45));
}
.eyebrow-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent-2);
  box-shadow: 0 0 8px var(--accent-2), 0 0 18px rgba(255,176,46,.4);
}

/* ── 404 number ── */
.error-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(120px, 26vw, 240px);
  line-height: 0.85;
  letter-spacing: 0.06em;
  display: flex;
  align-items: center;
  gap: 0;
  opacity: 0;
  animation: fadeUp 0.9s var(--ease) 0.2s forwards;
  position: relative;
}

.error-num .n-solid {
  background: linear-gradient(160deg, #ff9a38 0%, var(--accent) 40%, var(--accent-2) 80%, #ffd080 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 48px rgba(255,122,26,.25)) drop-shadow(0 0 80px rgba(255,122,26,.12));
}

.error-num .n-ghost {
  -webkit-text-fill-color: transparent;
  -webkit-text-stroke: 1px rgba(255,122,26,.2);
  color: transparent;
  margin-left: -0.04em;
}

/* ── divider ── */
.divider {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 28px auto 32px;
  opacity: 0;
  animation: fadeUp 0.6s var(--ease) 0.65s forwards;
}
.divider-line {
  width: 60px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,122,26,.3));
}
.divider-line:last-child {
  background: linear-gradient(270deg, transparent, rgba(255,122,26,.3));
}
.divider-mark { width: 4px; height: 4px; border-radius: 50%; background: rgba(255,122,26,.5); }

/* ── title ── */
.error-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(26px, 5.5vw, 44px);
  letter-spacing: 0.05em;
  color: var(--text);
  line-height: 1;
  margin-bottom: 16px;
  opacity: 0;
  animation: fadeUp 0.7s var(--ease) 0.75s forwards;
}
.error-title em {
  font-style: normal;
  background: linear-gradient(110deg, var(--accent) 20%, var(--accent-2) 80%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ── desc ── */
.error-desc {
  font-size: 13.5px;
  font-weight: 400;
  color: var(--muted);
  line-height: 1.8;
  letter-spacing: 0.02em;
  max-width: 34ch;
  opacity: 0;
  animation: fadeUp 0.7s var(--ease) 0.88s forwards;
}

/* ── back button ── */
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  margin-top: 40px;
  height: 46px;
  padding: 0 26px;
  border-radius: 999px;
  border: 1px solid rgba(255,190,130,.35);
  background: linear-gradient(135deg, #ff9a4d, #ff7a1a 55%, #e55f00);
  color: #fff;
  font: 600 13px 'Inter', sans-serif;
  letter-spacing: .02em;
  text-decoration: none;
  cursor: pointer;
  box-shadow: 0 10px 28px -10px rgba(255,122,26,.7), inset 0 1px 0 rgba(255,255,255,.28);
  transition: transform 0.3s var(--ease-spring), box-shadow 0.3s var(--ease);
  position: relative;
  overflow: hidden;
  opacity: 0;
  animation: fadeUp 0.7s var(--ease) 1s forwards;
}
.back-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.25) 50%, transparent 65%);
  transform: translateX(-130%);
  transition: transform 0.7s var(--ease);
}
.back-btn:hover::after { transform: translateX(130%); }
.back-btn:hover {
  transform: translateY(-2px) scale(1.03);
  box-shadow: 0 16px 36px -10px rgba(255,122,26,.88), inset 0 1px 0 rgba(255,255,255,.38);
}
.back-btn:active { transform: scale(.97); }
.back-btn svg { width: 13px; height: 13px; flex-shrink: 0; transition: transform 0.2s var(--ease); }
.back-btn:hover svg { transform: translateX(-2px); }

/* ── animations ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (max-width: 500px) {
  .corner { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  .eyebrow, .error-num, .divider, .error-title, .error-desc, .back-btn, .corner { opacity: 1 !important; }
}
</style>

<div class="corner corner--tl"></div>
<div class="corner corner--tr"></div>
<div class="corner corner--bl"></div>
<div class="corner corner--br"></div>

<div class="stage">
  <div class="eyebrow">
    <span class="eyebrow-line"></span>
    <span class="eyebrow-dot"></span>
    Marselo Anime
    <span class="eyebrow-dot"></span>
    <span class="eyebrow-line" style="background:linear-gradient(270deg,transparent,rgba(255,176,46,0.45))"></span>
  </div>

  <div class="error-num">
    <span class="n-solid">4</span>
    <span class="n-ghost">0</span>
    <span class="n-solid">4</span>
  </div>

  <div class="divider">
    <span class="divider-line"></span>
    <span class="divider-mark"></span>
    <span class="divider-mark" style="width:6px;height:6px;background:rgba(255,122,26,.7)"></span>
    <span class="divider-mark"></span>
    <span class="divider-line"></span>
  </div>

  <h1 class="error-title">LOST IN THE <em>STREAM</em></h1>

  <p class="error-desc">The episode or page you're looking for has been removed, renamed, or dropped from the lineup entirely.</p>

  <a href="index.html" class="back-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"/>
      <polyline points="12 19 5 12 12 5"/>
    </svg>
    Return to Discovery
  </a>
</div>

</body></html>
