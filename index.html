<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>marse.lol</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

:root {
  --bg:       #04040a;
  --surface:  #0d0d16;
  --surface-2:#13131f;
  --border:   rgba(255,255,255,0.06);
  --text:     #f0eee8;
  --muted:    #5a5965;
  --accent:   #ff7a1a;
  --accent-2: #ffb02e;
  --ease:     cubic-bezier(0.16,1,0.3,1);
  --ease-spring: cubic-bezier(0.34,1.56,0.64,1);
  color-scheme: dark;
}


*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding-left:  max(16px, env(safe-area-inset-left,  0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 48px;
  position: relative;
  cursor: default;
  user-select: none;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 90% 70% at 50% 55%, rgba(255,122,26,0.11) 0%, transparent 60%),
    radial-gradient(ellipse 50% 50% at 15% 90%, rgba(255,176,46,0.08) 0%, transparent 55%),
    radial-gradient(ellipse 40% 35% at 85% 10%, rgba(255,90,10,0.07) 0%, transparent 50%),
    radial-gradient(ellipse 100% 50% at 50% 100%, rgba(255,122,26,0.09) 0%, transparent 50%);
  z-index: 0;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image: radial-gradient(circle, rgba(255,255,255,.07) 1px, transparent 1px);
  background-size: 36px 36px;
  mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
  -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
  z-index: 0;
}

.stage {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  text-align: center;
  max-width: 760px;
  width: 100%;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255,176,46,0.7);
  margin-bottom: 36px;
  opacity: 0;
  animation: fadeUp 0.7s var(--ease) 0.1s forwards;
}

.eyebrow-line {
  width: 28px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,176,46,0.5));
}
.eyebrow-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent-2);
  box-shadow: 0 0 8px var(--accent-2), 0 0 18px rgba(255,176,46,.45);
  animation: pulse 2.4s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%       { opacity: .5; transform: scale(.7); }
}

.headline {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(88px, 20vw, 192px);
  line-height: 0.88;
  letter-spacing: 0.025em;
  color: var(--text);
  text-wrap: balance;
  opacity: 0;
  animation: fadeUp 0.9s var(--ease) 0.2s forwards;
  position: relative;
}

.headline .this-is {
  display: block;
  font-size: clamp(32px, 7vw, 64px);
  letter-spacing: 0.22em;
  color: var(--muted);
  margin-bottom: 4px;
  font-weight: 400;
}

.headline em {
  display: block;
  font-style: normal;
  background: linear-gradient(115deg, #ff9a38 0%, var(--accent) 35%, var(--accent-2) 75%, #ffd080 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 48px rgba(255,122,26,.28)) drop-shadow(0 0 96px rgba(255,122,26,.15));
  position: relative;
}

.divider {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 36px auto;
  opacity: 0;
  animation: fadeUp 0.6s var(--ease) 0.7s forwards;
}
.divider-line {
  width: 80px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,122,26,.3));
}
.divider-line:last-child {
  background: linear-gradient(270deg, transparent, rgba(255,122,26,.3));
}
.divider-mark {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: rgba(255,122,26,.5);
}

.sub {
  font-size: 14px;
  font-weight: 400;
  color: var(--muted);
  letter-spacing: 0.025em;
  line-height: 1.85;
  max-width: 34ch;
  opacity: 0;
  animation: fadeUp 0.7s var(--ease) 0.85s forwards;
}

@keyframes scanMove {
  0%   { transform: translateY(-100%); opacity: 0; }
  10%  { opacity: 1; }
  90%  { opacity: 1; }
  100% { transform: translateY(500%); opacity: 0; }
}
.scan-wrap {
  position: relative;
  display: inline-block;
  overflow: visible;
}
.scan-line {
  position: absolute;
  left: -4%;
  right: -4%;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(255,180,80,.6), transparent);
  border-radius: 1px;
  top: 0;
  pointer-events: none;
  animation: scanMove 3.5s var(--ease) 1.5s infinite;
  filter: blur(1px);
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 52px;
  padding: 8px 18px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,.07);
  background: rgba(255,255,255,.025);
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  opacity: 0;
  animation: fadeUp 0.7s var(--ease) 1.1s forwards;
  backdrop-filter: blur(12px);
}

.badge-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #10b981;
  box-shadow: 0 0 8px rgba(16,185,129,.7), 0 0 16px rgba(16,185,129,.3);
  flex-shrink: 0;
}

.corner {
  position: fixed;
  width: 32px;
  height: 32px;
  opacity: 0.14;
  pointer-events: none;
  animation: fadeUp 1s var(--ease) 1.4s both;
}
.corner--tl { top: 32px; left: 32px; border-top: 1px solid var(--accent-2); border-left: 1px solid var(--accent-2); }
.corner--tr { top: 32px; right: 32px; border-top: 1px solid var(--accent-2); border-right: 1px solid var(--accent-2); }
.corner--bl { bottom: 32px; left: 32px; border-bottom: 1px solid var(--accent-2); border-left: 1px solid var(--accent-2); }
.corner--br { bottom: 32px; right: 32px; border-bottom: 1px solid var(--accent-2); border-right: 1px solid var(--accent-2); }


.url-hint {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.12em;
  color: rgba(255,255,255,.12);
  text-transform: uppercase;
  pointer-events: none;
  opacity: 0;
  animation: fadeUp 0.6s var(--ease) 1.6s forwards;
  white-space: nowrap;
  z-index: 2;
}


@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (max-width: 500px) {
  .corner { display: none; }
  .url-hint { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  .headline, .eyebrow, .sub, .badge, .divider, .corner, .url-hint { opacity: 1 !important; }
  .divider-line { width: 80px !important; }
}
</style>

<div class="corner corner--tl"></div>
<div class="corner corner--tr"></div>
<div class="corner corner--bl"></div>
<div class="corner corner--br"></div>

<div class="stage">
  <div class="eyebrow">
    <span class="eyebrow-line"></span>
    <span class="eyebrow-dot"></span>
    COMING SOON
    <span class="eyebrow-dot"></span>
    <span class="eyebrow-line" style="background:linear-gradient(270deg,transparent,rgba(255,176,46,0.5))"></span>
  </div>

  <h1 class="headline">
    <span class="this-is">This is</span>
    <span class="scan-wrap">
      <em>marse.lol</em>
      <span class="scan-line"></span>
    </span>
  </h1>

  <div class="divider">
    <span class="divider-line"></span>
    <span class="divider-mark"></span>
    <span class="divider-mark" style="width:6px;height:6px;background:rgba(255,122,26,.7)"></span>
    <span class="divider-mark"></span>
    <span class="divider-line"></span>
  </div>

  <p class="sub">It will.</p>

  <div class="badge">
    <span class="badge-dot"></span>
    Working on it
  </div>
</div>

<div class="url-hint">marse.lol</div>

</body></html>
